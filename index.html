<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geni AI Global Hub - Official</title>

<style>
:root{--bg:#080808;--card:#141414;--gold:#ffd700;--light:#ffea75;--text:#fff;--muted:#a0a0a0;--border:#332d00}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{text-decoration:none;color:inherit}

/* ===== NAVIGATION ===== */
nav{background:#0b0b0b;border-bottom:1px solid var(--gold);padding:12px 4%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:10px}
.logo{color:var(--gold);font-size:1.35rem;font-weight:800;white-space:nowrap}
.nav-links{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.nav-links a{color:#ddd;font-size:.88rem;padding:4px 2px;transition:.2s}
.nav-links a:hover{color:var(--gold)}
.nav-links a.delete-link{color:#ff6b6b;font-weight:600}
.nav-links a.delete-link:hover{color:#ff4d4d}

header{text-align:center;padding:55px 20px;background:linear-gradient(135deg,#111,#000);border-bottom:2px solid var(--gold)}
header h1{color:var(--gold);font-size:clamp(2rem,5.5vw,3.2rem)}
header p{color:var(--muted);font-size:1.1rem;margin:8px 0 18px}
.btn{display:inline-block;padding:9px 16px;border:1px solid var(--gold);border-radius:8px;color:var(--gold);margin:3px;font-weight:600;font-size:.9rem}
.btn.primary{background:var(--gold);color:#000}

.container{max-width:1300px;margin:35px auto;padding:0 18px}
.section-title{text-align:center;margin:45px 0 22px}
.section-title h2{color:var(--gold);font-size:1.9rem}
.section-title p{color:var(--muted)}

.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.info-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;text-align:center}
.info-card h3{color:var(--light);margin-bottom:7px;font-size:1.05rem}
.info-card p{color:var(--muted);font-size:.88rem;margin-bottom:12px}

.policy-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

.filter-container{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-bottom:35px}
.filter-btn{background:var(--card);color:var(--gold);border:1px solid var(--border);padding:10px 20px;border-radius:30px;cursor:pointer;font-size:.95rem;font-weight:600}
.filter-btn:hover,.filter-btn.active{background:var(--gold);color:#000;box-shadow:0 0 12px rgba(255,215,0,.35)}

/* ===== VERY SMALL SQUARE ICONS ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(100px, 1fr));
  gap:12px;
  justify-content:center;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  transition:.25s;
  cursor:pointer;
  width:100%;
  max-width:110px;
  margin:0 auto;
}

.card:hover{
  transform:translateY(-4px);
  border-color:var(--gold);
  box-shadow:0 6px 15px rgba(255,215,0,.2);
}

.card img{
  width:100%;
  height:90px;
  object-fit:cover;
  background:#000;
  display:block;
}

.card-content{
  padding:6px 4px;
  text-align:center;
}

.card-content h3{
  color:var(--light);
  font-size:0.72rem;
  margin-bottom:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card-content p{
  display:none;
}

/* ===== LIGHTBOX ===== */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;justify-content:center;align-items:center;padding:20px}
.lightbox.active{display:flex}
.lightbox-content{position:relative;max-width:95vw;max-height:90vh;text-align:center}
.lightbox-content img{max-width:100%;max-height:82vh;border-radius:10px;border:2px solid var(--gold);box-shadow:0 0 30px rgba(255,215,0,.25)}
.lightbox-close{position:absolute;top:-42px;right:0;background:var(--gold);color:#000;border:none;width:36px;height:36px;border-radius:50%;font-size:1.4rem;font-weight:700;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
.lightbox-close:hover{background:#fff}
.lightbox-caption{color:var(--light);margin-top:12px;font-size:1rem}

footer{text-align:center;padding:28px;background:#040404;color:var(--muted);border-top:1px solid #1a1a1a;margin-top:55px}
.footer-links{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-bottom:12px}
.footer-links a:hover{color:var(--gold)}
.whatsapp{color:#8ee58e!important}

@media(max-width:900px){
  .info-grid{grid-template-columns:repeat(2,1fr)}
  .nav-links{gap:10px}
  .nav-links a{font-size:.8rem}
}

@media(max-width:600px){
  .info-grid,.policy-grid{grid-template-columns:1fr}
  .grid{
    grid-template-columns:repeat(auto-fill, minmax(85px, 1fr));
    gap:8px;
  }
  .card{max-width:95px}
  .card img{height:75px}
  .card-content h3{font-size:0.65rem}
  .nav-links{justify-content:center}
}
</style>
</head>
